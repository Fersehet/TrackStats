<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrackStats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { font-family: "Roboto", "Segoe UI", Arial, sans-serif; }
  #wx { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Roboto", "Segoe UI", Arial, sans-serif; color: #e8f1f7; }
  #panel { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 270px; padding: 12px 14px 10px; background: rgba(var(--rgb, 15, 19, 20), var(--bg, 1)); border-radius: 10px; box-sizing: border-box; }
  #wx { position: absolute; top: 12px; right: 14px; font-size: 22px; line-height: 1.1; }
  #head { display: flex; align-items: center; gap: 8px; padding-right: 34px; }
  #level { font-size: 22px; font-weight: 700; line-height: 1.1; }
  #led { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #1c2022; box-shadow: inset 0 0 0 1px #2b3236; transition: background .3s, box-shadow .3s; }
  #led.on { background: #1e84ff; box-shadow: 0 0 6px 1px rgba(30, 132, 255, .75); }
  #led.hide { display: none; }
  #trend { font-size: 13px; min-height: 17px; margin-top: 3px; color: #9fb3c2; }
  #trend.up { color: #ff8a65; }
  #trend.down { color: #7bd88f; }
  #bar { display: flex; gap: 4px; margin: 10px 0 12px; }
  #bar i { flex: 1; height: 10px; border-radius: 3px; background: #1d2a35; }
  #bar i.on { background: var(--c); }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .row span:first-child { color: #9fb3c2; }
  #wind { display: flex; align-items: center; gap: 6px; }
  #wspd { font-weight: 400; }
  #arrow { transition: transform .3s; }
  #status { margin-top: 8px; font-size: 11px; color: #6c808f; }
  #raw { margin-top: 6px; font-size: 10px; line-height: 1.3; color: #6c808f; word-break: break-all; max-height: 90px; overflow: hidden; }
</style>
</head>
<body>
<div id="panel">
  <div id="wx"></div>
  <div id="head"><i id="led" class="hide" title="Declared wet"></i><span id="level">Waiting for iRacing…</span></div>
  <div id="trend"></div>
  <div id="bar"></div>
  <div class="row"><span>Rain</span><span id="rain">–</span></div>
  <div class="row"><span>Humidity</span><span id="hum">–</span></div>
  <div class="row"><span>Fog</span><span id="fog">–</span></div>
  <div class="row"><span>Wind</span><span id="wind"><svg id="arrow" viewBox="-12 -12 24 24" width="16" height="16"><path d="M0 -10 L7 8 L0 4 L-7 8 Z" fill="#8fd3f4"/></svg><b id="wspd">–</b></span></div>
  <div class="row"><span>Track usage</span><span id="rubber">–</span></div>
  <div id="status">Connecting…</div>
  <div id="raw"></div>
</div>

<script>
(function () {
  var PARAMS = ["TrackWetness", "Precipitation", "RelativeHumidity", "WindDir", "WindVel", "YawNorth", "SessionNum", "SessionInfo", "Skies", "WeatherDeclaredWet", "FogLevel"];
  // iRacing: 1 = dry ... 7 = extremely wet
  var LABELS = ["Unknown", "Dry", "Mostly dry", "Very lightly wet", "Lightly wet", "Moderately wet", "Very wet", "Extremely wet"];
  var COLORS = ["#8fd3f4", "#5bb6ec", "#3b9be0", "#2f7fd1", "#3a63c4", "#4a49b0"]; // levels 2..7
  var DEBUG = /[?&]debug=1/.test(location.search);
  // Background opacity via link: ?opacity=0.5 or ?opacity=50 (0 = transparent, 1 / 100 = fully solid)
  var om = location.search.match(/[?&]opacity=([0-9.]+)/);
  if (om) {
    var ov = parseFloat(om[1]);
    if (ov > 1) ov = ov / 100;
    if (isFinite(ov)) document.documentElement.style.setProperty("--bg", Math.min(1, Math.max(0, ov)));
  }
  // Background color via link: ?color=0f1314 (hex, without #). Default matches the KAPPS Relatives overlay.
  var cm = location.search.match(/[?&]color=#?([0-9a-fA-F]{6})/);
  if (cm) {
    var cv = parseInt(cm[1], 16);
    document.documentElement.style.setProperty("--rgb", ((cv >> 16) & 255) + "," + ((cv >> 8) & 255) + "," + (cv & 255));
  }
  var NORTH = /[?&]norden=1/.test(location.search); // arrow points north instead of relative to the car
  var FLIP = /[?&]flip=1/.test(location.search);   // reverse rotation if the arrow is mirrored

  var state = {}, prevLevel = null, trend = 0, ws = null;
  var $ = function (id) { return document.getElementById(id); };

  var bar = $("bar");
  for (var i = 0; i < 6; i++) bar.appendChild(document.createElement("i"));

  // Finds a key anywhere in the JSON so the overlay copes with different message formats
  function find(obj, key, depth) {
    if (obj === null || typeof obj !== "object" || (depth || 0) > 4) return undefined;
    if (Object.prototype.hasOwnProperty.call(obj, key)) return normalize(obj[key]);
    for (var k in obj) {
      var r = find(obj[k], key, (depth || 0) + 1);
      if (r !== undefined) return r;
    }
    return undefined;
  }
  function normalize(v) {
    if (Array.isArray(v)) return normalize(v[0]);
    if (v && typeof v === "object" && "value" in v) return v.value;
    return v;
  }

  // Track usage = rubber state of the current session (from the iRacing session info)
  function raw(obj, key, d) {
    if (obj === null || typeof obj !== "object" || (d || 0) > 4) return undefined;
    if (Object.prototype.hasOwnProperty.call(obj, key)) return obj[key];
    for (var k in obj) { var r = raw(obj[k], key, (d || 0) + 1); if (r !== undefined) return r; }
    return undefined;
  }
  function trackUsage() {
    var si = state.SessionInfo, n = Number(state.SessionNum) || 0, v;
    if (typeof si === "string") {
      var m = si.match(/SessionTrackRubberState:[ \t]*[^\r\n]+/g) || [];
      if (m.length) v = (m[Math.min(n, m.length - 1)]).replace(/SessionTrackRubberState:[ \t]*/, "");
    } else if (si) {
      var ss = raw(si, "Sessions");
      if (Array.isArray(ss) && ss.length) {
        var cur = ss.filter(function (x) { return x && Number(x.SessionNum) === n; })[0] || ss[Math.min(n, ss.length - 1)];
        if (cur) v = cur.SessionTrackRubberState;
      } else {
        v = raw(si, "SessionTrackRubberState");
      }
    }
    if (typeof v !== "string" || !v) return "–";
    v = v.trim();
    return v.charAt(0).toUpperCase() + v.slice(1);
  }

  function render() {
    var lvl = Math.round(Number(state.TrackWetness));
    if (!(lvl >= 0 && lvl <= 7)) lvl = 0;

    if (prevLevel !== null && lvl !== prevLevel && lvl > 0 && prevLevel > 0) trend = lvl > prevLevel ? 1 : -1;
    if (lvl > 0) prevLevel = lvl;

    $("level").textContent = state.TrackWetness === undefined ? "Waiting for iRacing…" : LABELS[lvl];
    // LED in front of the label: lit while race control has declared the session wet
    var dw = state.WeatherDeclaredWet;
    $("led").className = state.TrackWetness === undefined ? "hide" : (dw === true || dw === 1 || dw === "1" || dw === "true") ? "on" : "";
    var t = $("trend");
    t.className = trend > 0 ? "up" : trend < 0 ? "down" : "";
    t.textContent = trend > 0 ? "▲ getting wetter" : trend < 0 ? "▼ drying" : "";

    var segs = bar.children;
    for (var i = 0; i < 6; i++) {
      var on = lvl >= i + 2;
      segs[i].className = on ? "on" : "";
      segs[i].style.setProperty("--c", COLORS[i]);
    }

    var p = Number(state.Precipitation), h = Number(state.RelativeHumidity), fg = Number(state.FogLevel);
    $("rain").textContent = isFinite(p) && state.Precipitation !== undefined ? Math.round(p * 100) + " %" : "–";
    $("hum").textContent = isFinite(h) && state.RelativeHumidity !== undefined ? Math.round(h * 100) + " %" : "–";
    $("fog").textContent = isFinite(fg) && state.FogLevel !== undefined ? Math.round(fg * 100) + " %" : "–";
    var wd = Number(state.WindDir), wv = Number(state.WindVel), yaw = Number(state.YawNorth) || 0;
    if (state.WindVel !== undefined && isFinite(wv)) {
      $("wspd").textContent = Math.round(wv * 3.6) + " km/h";
      if (state.WindDir !== undefined && isFinite(wd)) {
        // WindDir = direction the wind comes from; arrow shows where it blows to
        var rel = NORTH ? wd : wd - yaw;
        var deg = (FLIP ? -1 : 1) * rel * 180 / Math.PI + 180;
        $("arrow").style.transform = "rotate(" + deg + "deg)";
      }
    }
    $("rubber").textContent = trackUsage();
    // Weather emoji: rain wins, then fog (20 % or more), otherwise by cloud cover (Skies 0-3)
    var sk = Number(state.Skies), pr = Number(state.Precipitation), fo = Number(state.FogLevel), em = "";
    if (state.Precipitation !== undefined && isFinite(pr) && pr >= 0.05) em = "🌧️";
    else if (state.FogLevel !== undefined && isFinite(fo) && fo >= 0.2) em = "🌁";
    else if (state.Skies !== undefined && isFinite(sk)) em = ["☀️", "🌤️", "⛅", "☁️"][Math.min(3, Math.max(0, Math.round(sk)))];
    $("wx").textContent = em;
    fit();
  }

  // Scale the whole panel to fit the overlay window (no scroll bars)
  function fit() {
    var panel = $("panel");
    panel.style.transform = "none";
    var k = Math.min(window.innerWidth / panel.offsetWidth, window.innerHeight / panel.offsetHeight);
    if (isFinite(k) && k > 0) panel.style.transform = "scale(" + k + ")";
  }
  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  function setStatus(s) { $("status").textContent = s; }

  function connect() {
    var host = location.host || "127.0.0.1:8182";
    var url = (location.protocol === "https:" ? "wss://" : "ws://") + host + "/ws";
    setStatus("Connecting to " + url);
    try { ws = new WebSocket(url); } catch (e) { setTimeout(connect, 3000); return; }

    ws.onopen = function () {
      setStatus("Connected – waiting for data");
      ws.send(JSON.stringify({ fps: 5, readIBT: false, record: false, requestParams: PARAMS, requestParamsOnce: [] }));
    };
    ws.onmessage = function (e) {
      var m;
      try { m = JSON.parse(e.data); } catch (err) { return; }
      var got = false;
      PARAMS.forEach(function (k) {
        var v = find(m, k);
        if (v !== undefined) { state[k] = v; got = true; }
      });
      if (got) { setStatus("Live"); render(); }
      if (DEBUG) $("raw").textContent = e.data.slice(0, 400);
    };
    ws.onclose = function () { setStatus("Disconnected – retrying…"); setTimeout(connect, 2000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  render();
  connect();
})();
</script>
</body>
</html>
