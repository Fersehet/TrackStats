<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -4 285 72" width="285" height="72" role="img" aria-label="TrackStats">
<title>TrackStats</title>
<style>
    .tile{animation:pop .5s cubic-bezier(.3,1.5,.5,1) .05s both}
    .edge{stroke-dasharray:100;animation:edge 1.1s ease-out .1s both}
    .drop{animation:fall .55s cubic-bezier(.3,1.6,.5,1) .55s both}
    .loopd{transform-box:fill-box;transform-origin:center;animation:breath 3.2s ease-in-out 3s infinite}
    .seg{transform-box:fill-box;transform-origin:center}
    @keyframes gh{0%,100%{opacity:1}20%{opacity:.3}40%{opacity:1}}
    .row{transform-box:fill-box;transform-origin:left center}
    .r1{animation:grow .45s cubic-bezier(.3,.9,.3,1) 1.7s both,rp 3.2s ease-in-out 3s infinite}
    .r2{animation:grow .45s cubic-bezier(.3,.9,.3,1) 1.85s both,rp 3.2s ease-in-out 3.5s infinite}
    .b1{animation:fade .3s ease 2.1s both}
    .b2{animation:fade .3s ease 2.25s both}
    .v1{animation:fade .3s ease 2.1s both,vp 3.2s ease-in-out 3s infinite}
    .v2{animation:fade .3s ease 2.25s both,vp 3.2s ease-in-out 3.5s infinite}
    .l{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
    @keyframes edge{0%{stroke-dashoffset:100;stroke:#1e84ff;opacity:1}60%{stroke-dashoffset:0;stroke:#1e84ff}100%{stroke-dashoffset:0;stroke:#1c2022}}
    @keyframes fall{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
    @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    @keyframes grow{from{opacity:0;transform:scaleX(.05)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rp{0%,100%{fill:#1c2022}50%{fill:#2b3236}}
    @keyframes vp{0%,100%{opacity:.7}50%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
